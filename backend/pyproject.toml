[project]
name = "sabq"
version = "0.1.0"
description = "Sabq (سبق): news radar for newsrooms"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "httpx2[http2]>=2.14",
    "protego>=0.4",
    "feedparser>=6.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabq"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["sabq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a PostgreSQL database (DATABASE_URL)"]
