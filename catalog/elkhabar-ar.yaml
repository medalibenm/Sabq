# El Khabar (الخبر), national daily, in Arabic. Investigated 2026-10-31 (docs/adding-sources.md).
slug: elkhabar-ar
name: الخبر
home_url: https://www.elkhabar.com/
language: ar
kind: national
tier: normal
# The feed holds the 5 newest articles plus 5 columns and 5 videos, so it must be read often.
poll_interval_s: 300
access_method: rss
robots:
  checked_at: 2026-10-31
  result: allowed            # disallows /api, /captcha, /login, */view, */comments
listings:
  - https://www.elkhabar.com/feed/
fields:
  id:
    path: $.link
    regex: '-(\d+)$'
  title: $.title
  link: $.link
  published: $.published       # "13:40 | 31-10-2026", Algiers: 14:57 seen at 14:04 UTC; not in date order
  lead: $.summary              # an <img> followed by the lead
  image:
    path: $.summary
    regex: '<img[^>]+src="([^"]+)"'
  rubric:                      # for the exclusion only
    path: $.link
    regex: 'elkhabar\.com/([^/]+)/'
exclude:
  rubric: '^(videos|photos)$'
dates:
  published_tz: Africa/Algiers
  confidence: source_meta
