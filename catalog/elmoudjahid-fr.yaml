# El Moudjahid, national daily, French edition. Investigated 2026-10-31 (docs/adding-sources.md).
slug: elmoudjahid-fr
name: El Moudjahid
home_url: https://www.elmoudjahid.dz/fr
language: fr
kind: national
tier: normal
# The feed holds the 5 newest articles plus 5 of each of three rubrics, so it must be read often.
poll_interval_s: 300
access_method: rss
robots:
  checked_at: 2026-10-31
  result: allowed            # disallows only /*index.php*
listings:
  - https://www.elmoudjahid.dz/fr/feed
fields:
  id:
    path: $.link
    regex: '-(\d+)$'
  title: $.title
  link: $.link
  published: $.published       # "14:19 | 31-10-2026", Algiers: seen at 13:55 UTC, so not UTC
  lead: $.summary              # an <img> followed by the lead
  image:                       # images are served from elmoudjahid.com
    path: $.summary
    regex: '<img[^>]+src="([^"]+)"'
  rubric:                      # for the exclusion only
    path: $.link
    regex: 'elmoudjahid\.dz/fr/([^/]+)/'
exclude:
  rubric: '^(videos|photos)$'
dates:
  published_tz: Africa/Algiers
  confidence: source_meta
