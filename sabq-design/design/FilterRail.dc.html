<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sabq — filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div dir="{{dir}}" lang="{{ui}}" style="height: 100%; font-family: {{font}}; color: {{t.text}}; font-variant-numeric: tabular-nums">
  <sc-if value="{{collapsedRail}}" hint-placeholder-val="{{ false }}">
    <aside aria-label="{{L.filters}}" style="width: 52px; height: 100%; min-height: 100%; box-sizing: border-box; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: {{t.panel}}; border-inline-end: 1px solid {{t.line}}">
      <button type="button" onClick="{{toggleCollapse}}" aria-label="{{L.expand}}" style="position: relative; width: 40px; height: 40px; border-radius: 8px; border: 1px solid {{t.line2}}; background: transparent; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v5l-4 2v-7z"></path></svg>
        <sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -6px; inset-inline-end: -6px; min-width: 18px; height: 18px; padding-inline: 4px; box-sizing: border-box; border-radius: 999px; background: {{t.acc}}; color: {{t.onAcc}}; font: 700 11px/18px 'IBM Plex Sans',system-ui,sans-serif; text-align: center">{{activeCount}}</span></sc-if>
      </button>
    </aside>
  </sc-if>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <aside aria-label="{{L.filters}}" style="width: {{width}}; height: {{height}}; min-height: {{minH}}; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.panel}}; border-inline-end: {{edge}}; border-radius: {{radius}}; box-shadow: {{sheetShadow}}">
      <sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
        <div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 999px; background: {{t.line2}}"></span></div>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">{{L.filters}}</h2>
        <sc-if value="{{hasActive}}" hint-placeholder-val="{{ false }}"><span style="font: 700 11px/18px 'IBM Plex Sans',system-ui,sans-serif; padding-inline: 6px; border-radius: 999px; background: {{t.acc}}; color: {{t.onAcc}}">{{activeCount}}</span></sc-if>
        <span style="flex: 1"></span>
        <sc-if value="{{isRail}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{toggleCollapse}}" aria-label="{{L.collapse}}" style="width: 32px; height: 32px; border-radius: 6px; border: 0; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M15 4v16"></path></svg>
          </button>
        </sc-if>
        <sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-label="{{L.close}}" style="width: 44px; height: 44px; border-radius: 8px; border: 0; background: transparent; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </sc-if>
      </div>

      <div style="flex: 1; min-height: 0; overflow: auto; padding: 0 10px 16px; display: flex; flex-direction: column; gap: 18px">
        <section aria-labelledby="fr-src" style="display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px 6px">
            <h3 id="fr-src" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: {{capsSpacing}}; color: {{t.text2}}; text-transform: {{caps}}">{{L.sources}}</h3>
            <span style="font-size: 11.5px; color: {{t.text3}}">{{L.today}}</span>
          </div>
          <div style="position: relative; display: flex; align-items: center; padding: 0 2px 6px">
            <label for="fr-src-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{L.searchSources}}</label>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="position: absolute; inset-inline-start: 12px; top: 11px; color: {{t.text3}}; pointer-events: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="fr-src-q" type="search" value="{{srcQuery}}" onChange="{{onSrcQuery}}" placeholder="{{L.searchSources}}" style="width: 100%; height: 34px; box-sizing: border-box; padding-inline: 30px 10px; border-radius: 8px; border: 1px solid {{t.line2}}; background: {{t.field}}; color: {{t.text}}; font: 400 13px {{font}}; outline: none">
          </div>
          <sc-for list="{{sources}}" as="s" hint-placeholder-count="8">
            <button type="button" role="checkbox" aria-checked="{{s.checked}}" onClick="{{s.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 38px; padding-inline: 8px; border-radius: 8px; border: 0; background: {{s.rowBg}}; color: {{t.text}}; font-family: {{font}}; cursor: pointer; text-align: start">
              <span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 4px; border: {{s.boxBorder}}; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center; color: {{t.onAcc}}">
                <sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
              <span style="flex: 1; min-width: 0; font-size: 13.5px; font-weight: {{s.weight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><bdi>{{s.name}}</bdi></span>
              <sc-if value="{{s.stopped}}" hint-placeholder-val="{{ false }}">
                <span title="{{L.stoppedTitle}}" style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: {{t.bad}}">
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"></path><path d="M9 9l6 6M15 9l-6 6"></path></svg>
                  {{L.stopped}}
                </span>
              </sc-if>
              <span style="font: 600 10px/15px 'IBM Plex Sans',system-ui,sans-serif; padding-inline: 4px; border-radius: 3px; border: 1px solid {{t.line2}}; color: {{t.text2}}">{{s.lang}}</span>
              <span style="flex: none; width: 22px; text-align: end; font-size: 12.5px; color: {{t.text2}}">{{s.count}}</span>
            </button>
          </sc-for>
          <sc-if value="{{noSrc}}" hint-placeholder-val="{{ false }}"><p style="margin: 6px 8px; font-size: 13px; color: {{t.text3}}">{{L.noSrc}}</p></sc-if>
          <sc-if value="{{srcMore.show}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{srcMore.toggle}}" aria-expanded="{{srcMore.expanded}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; margin-top: 2px; padding-inline: 8px; border-radius: 6px; border: 0; background: transparent; color: {{t.accText}}; font: 600 13px {{font}}; cursor: pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{srcMore.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
              {{srcMore.label}}
            </button>
          </sc-if>
        </section>

        <section aria-labelledby="fr-wil" style="display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px 6px">
            <h3 id="fr-wil" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: {{capsSpacing}}; color: {{t.text2}}; text-transform: {{caps}}">{{L.wilayas}}</h3>
            <span style="font-size: 11.5px; color: {{t.text3}}">{{L.today}}</span>
          </div>
          <sc-for list="{{wilayas}}" as="w" hint-placeholder-count="3">
            <button type="button" role="checkbox" aria-checked="{{w.checked}}" onClick="{{w.toggle}}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding-inline: 8px; border-radius: 8px; border: 0; background: {{w.rowBg}}; color: {{t.text}}; font-family: {{font}}; cursor: pointer; text-align: start">
              <span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 4px; border: {{w.boxBorder}}; background: {{w.boxBg}}; display: flex; align-items: center; justify-content: center; color: {{t.onAcc}}">
                <sc-if value="{{w.on}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
              </span>
              <span style="flex: none; width: 22px; font: 600 12.5px 'IBM Plex Sans',system-ui,sans-serif; color: {{t.text2}}">{{w.code}}</span>
              <span style="flex: 1; font-size: 14px; font-weight: {{w.weight}}">{{w.name}}</span>
              <span style="font-size: 12.5px; color: {{t.text2}}">{{w.count}}</span>
            </button>
          </sc-for>
          <sc-if value="{{wilMore.show}}" hint-placeholder-val="{{ true }}">
            <button type="button" onClick="{{wilMore.toggle}}" aria-expanded="{{wilMore.expanded}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; margin-top: 2px; padding-inline: 8px; border-radius: 6px; border: 0; background: transparent; color: {{t.accText}}; font: 600 13px {{font}}; cursor: pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{wilMore.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
              {{wilMore.label}}
            </button>
          </sc-if>
        </section>
      </div>

      <sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 10px; padding: 12px 16px 20px; border-top: 1px solid {{t.line}}">
          <button type="button" onClick="{{clear}}" style="flex: 1; height: 48px; border-radius: 10px; border: 1px solid {{t.line2}}; background: transparent; color: {{t.text}}; font: 600 15px {{font}}; cursor: pointer">{{L.clear}}</button>
          <button type="button" style="flex: 2; height: 48px; border-radius: 10px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; font: 700 15px {{font}}; cursor: pointer">{{showLabel}}</button>
        </div>
      </sc-if>
    </aside>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"ui":{"editor":"enum","options":["ar","fr"],"default":"ar"},"variant":{"editor":"enum","options":["rail","sheet"],"default":"rail"},"collapsed":{"editor":"boolean","default":false},"selW":{"editor":null},"selS":{"editor":null},"onToggleW":{"editor":null},"onToggleS":{"editor":null},"onClear":{"editor":null},"$preview":{"width":280,"height":900}}'>
var TK = {
  dark: {panel:'#141619',field:'#191B1F',line:'#272A30',line2:'#41454D',text:'#EDEDEF',text2:'#A9ACB4',text3:'#8A8E97',acc:'#FFD23F',accText:'#FFD23F',onAcc:'#1A1600',sel:'rgba(255,210,63,0.12)',bad:'#F87171'},
  light: {panel:'#FAFAF8',field:'#FFFFFF',line:'#E2E2DD',line2:'#B9B9B1',text:'#16171A',text2:'#4B4D55',text3:'#686B73',acc:'#FFD23F',accText:'#835800',onAcc:'#1A1600',sel:'#FFF3C4',bad:'#C1272D'}
};
var FONT = { ar: "'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif", fr: "'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif" };
var LBL = {
  ar: {filters:'الفلاتر', collapse:'طيّ الفلاتر', expand:'إظهار الفلاتر', close:'إغلاق', wilayas:'الولايات', sources:'المصادر', today:'اليوم', searchSources:'ابحث في المصادر', noSrc:'لا يوجد مصدر بهذا الاسم', stopped:'متوقف', stoppedTitle:'هذا المصدر متوقف حاليًا', clear:'مسح', show:'عرض {n} مقالًا', more:'عرض المزيد ({n})', less:'عرض أقل'},
  fr: {filters:'Filtres', collapse:'Replier les filtres', expand:'Afficher les filtres', close:'Fermer', wilayas:'Wilayas', sources:'Sources', today:'aujourd’hui', searchSources:'Rechercher une source', noSrc:'Aucune source à ce nom', stopped:'Arrêtée', stoppedTitle:'Cette source est actuellement arrêtée', clear:'Effacer', show:'Voir {n} articles', more:'Afficher plus ({n})', less:'Afficher moins'}
};
var WIL = [
  {code:'00', ar:'وطني', fr:'National', n:61}, {code:'05', ar:'باتنة', fr:'Batna', n:44},
  {code:'17', ar:'الجلفة', fr:'Djelfa', n:18}, {code:'19', ar:'سطيف', fr:'Sétif', n:27}
];
var SRC = [
  {id:'aps', ar:'وكالة الأنباء الجزائرية', fr:'APS', l:'AR', n:38}, {id:'pres', ar:'رئاسة الجمهورية', fr:'Présidence de la République', l:'AR', n:4},
  {id:'aa', ar:'الأناضول', fr:'Anadolu', l:'AR', n:17}, {id:'hayat', ar:'الحياة', fr:'El Hayat', l:'AR', n:12},
  {id:'awras', ar:'الأوراس نيوز', fr:'Awras News', l:'AR', n:21}, {id:'hidhab', ar:'الهضاب', fr:'El Hidhab', l:'AR', n:6, stopped:true},
  {id:'djelfa', ar:'الجلفة إنفو', fr:'Djelfa Info', l:'AR', n:9}, {id:'setif1', ar:'سطيف وان', fr:'Setif One', l:'AR', n:14},
  {id:'moudj', ar:'El Moudjahid', fr:'El Moudjahid', l:'FR', n:13}, {id:'lexp', ar:'L’Expression', fr:'L’Expression', l:'FR', n:8}
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { collapsed: !!props.collapsed, srcQuery: '', localW: ['05'], localS: [], allW: false, allS: false }; }
  renderVals() {
    var self = this, theme = this.props.theme || 'dark', ui = this.props.ui || 'ar', variant = this.props.variant || 'rail';
    var t = TK[theme], L = LBL[ui];
    var controlled = !!this.props.onToggleW;
    var selW = controlled ? (this.props.selW || []) : this.state.localW;
    var selS = controlled ? (this.props.selS || []) : this.state.localS;
    var localToggle = function (key, v) { var cur = self.state[key].slice(), i = cur.indexOf(v); if (i >= 0) cur.splice(i, 1); else cur.push(v); var o = {}; o[key] = cur; self.setState(o); };
    var row = function (on) { return { on: on, checked: on ? 'true' : 'false', rowBg: on ? t.sel : 'transparent', boxBg: on ? t.acc : 'transparent', boxBorder: on ? '0' : '1.5px solid ' + t.line2, weight: on ? '600' : '400' }; };
    var wilayas = WIL.map(function (w) {
      var on = selW.indexOf(w.code) >= 0;
      return Object.assign(row(on), { code: w.code, name: w[ui], count: w.n, toggle: function () { if (controlled) self.props.onToggleW(w.code); else localToggle('localW', w.code); } });
    });
    var q = (this.state.srcQuery || '').trim().toLowerCase();
    var sources = SRC.filter(function (s) { return !q || (s.ar + ' ' + s.fr).toLowerCase().indexOf(q) >= 0; }).map(function (s) {
      var on = selS.indexOf(s.id) >= 0;
      return Object.assign(row(on), { name: s[ui], lang: s.l, count: s.n, stopped: !!s.stopped, toggle: function () { if (controlled) self.props.onToggleS(s.id); else localToggle('localS', s.id); } });
    });
    // Show more: selected items always stay visible; others are capped until expanded.
    var cap = function (list, limit, all, key) {
      var hidden = Math.max(list.length - limit, 0);
      var shown = all ? list : list.filter(function (x, i) { return i < limit || x.on; });
      var more = { show: hidden > 0, expanded: all ? 'true' : 'false', chev: all ? 'rotate(180deg)' : 'none',
        label: all ? L.less : L.more.replace('{n}', list.length - shown.length),
        toggle: function () { var o = {}; o[key] = !self.state[key]; self.setState(o); } };
      return { shown: shown, more: more };
    };
    var wCap = cap(wilayas, 3, this.state.allW, 'allW');
    var sCap = q ? { shown: sources, more: { show: false } } : cap(sources, 5, this.state.allS, 'allS');
    wilayas = wCap.shown; sources = sCap.shown;
    var activeCount = selW.length + selS.length;
    var isSheet = variant === 'sheet';
    return {
      t: t, L: L, ui: ui, dir: ui === 'ar' ? 'rtl' : 'ltr', font: FONT[ui],
      caps: ui === 'fr' ? 'uppercase' : 'none', capsSpacing: ui === 'fr' ? '0.05em' : '0',
      isSheet: isSheet, isRail: !isSheet,
      collapsedRail: !isSheet && this.state.collapsed, open: isSheet || !this.state.collapsed,
      toggleCollapse: function () { self.setState({ collapsed: !self.state.collapsed }); },
      width: isSheet ? '100%' : '280px', height: isSheet ? 'auto' : '100%', minH: isSheet ? '0' : '100%',
      edge: isSheet ? '0' : '1px solid ' + t.line, radius: isSheet ? '16px 16px 0 0' : '0',
      sheetShadow: isSheet ? '0 -12px 40px rgba(0,0,0,0.35)' : 'none',
      wilayas: wilayas, sources: sources, noSrc: sources.length === 0, wilMore: wCap.more, srcMore: sCap.more,
      srcQuery: this.state.srcQuery, onSrcQuery: function (e) { self.setState({ srcQuery: e.target.value }); },
      activeCount: activeCount, hasActive: activeCount > 0,
      clear: function () { if (self.props.onClear) self.props.onClear(); else self.setState({ localW: [], localS: [] }); },
      showLabel: L.show.replace('{n}', activeCount ? '71' : '142')
    };
  }
}
</script>
</body>
</html>
