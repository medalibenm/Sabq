<style>body{margin:0}</style>
</helmet>
<div dir="{{dir}}" lang="{{ui}}" style="min-height: 100vh; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: {{font}}; font-variant-numeric: tabular-nums; position: relative">

    <dc-import name="FilterRail" theme="{{theme}}" ui="{{ui}}" sel-w="{{selW}}" sel-s="{{selS}}" on-toggle-w="{{toggleW}}" on-toggle-s="{{toggleS}}" on-clear="{{clearAll}}" hint-size="280px,100%"></dc-import>
    <main style="flex: 999 1 560px; min-width: 0; padding: 16px 28px 48px; box-sizing: border-box">
      <div style="max-width: 880px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; position: relative">

        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 32px">

            <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
              <button type="button" onClick="{{c.remove}}" aria-label="{{c.aria}}" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding-inline: 10px 8px; border-radius: 999px; border: 1px solid {{t.line2}}; background: {{t.accSoft}}; color: {{t.text}}; font: 500 13px/1 {{font}}; cursor: pointer">
                <span>{{c.label}}</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </sc-for>
            <button type="button" onClick="{{clearAll}}" style="height: 28px; padding-inline: 6px; border: 0; background: transparent; color: {{t.accText}}; font: 600 13px/1 {{font}}; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">{{L.clearAll}}</button>
          </sc-if>
          <sc-if value="{{noChips}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 13px; color: {{t.text3}}">{{L.allScope}}</span>
          </sc-if>
          <span style="margin-inline-start: auto; font-size: 13px; color: {{t.text3}}">{{countLabel}}</span>
        </div>

        <sc-if value="{{showPill}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; top: 40px; inset-inline: 0; display: flex; justify-content: center; z-index: 6; pointer-events: none">
            <button type="button" onClick="{{reveal}}" style="pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 14px; border-radius: 999px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; box-shadow: {{t.shadow}}; cursor: pointer; font-family: {{font}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
              <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: start">
                <span style="font-size: 14px; font-weight: 700; line-height: 1.2">{{pillLabel}}</span>
                <sc-if value="{{pillSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 500; line-height: 1.2; opacity: 0.85">{{pillSub}}</span></sc-if>
              </span>
            </button>
          </div>
        </sc-if>

        <sc-if value="{{firstTime}}" hint-placeholder-val="{{ false }}">
          <section style="display: flex; gap: 14px; align-items: flex-start; padding: 18px 20px; border-radius: 10px; border: 1px dashed {{t.line2}}; background: {{t.panel}}">
            <span style="flex: none; width: 36px; height: 36px; border-radius: 8px; background: {{t.acc}}; color: {{t.onAcc}}; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 7a5 5 0 1 0 5 5"></path></svg>
            </span>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 600">{{L.ftTitle}}</h2>
              <p style="margin: 0; font-size: 14px; line-height: 1.6; color: {{t.text2}}; max-width: 620px">{{L.ftBody}}</p>
              <a href="Sources.dc.html" style="font-size: 13px; font-weight: 600; color: {{t.accText}}">{{L.ftLink}}</a>
            </div>
          </section>
        </sc-if>

        <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
          <div aria-busy="true" aria-label="{{L.loading}}" style="display: flex; flex-direction: column; gap: 10px">
            <sc-for list="{{skeletons}}" as="sk" hint-placeholder-count="5">
              <div style="display: flex; gap: 14px; padding: 16px; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.card}}">
                <sc-if value="{{sk.img}}" hint-placeholder-val="{{ true }}"><div style="flex: none; width: 128px; height: 84px; border-radius: 6px; background: {{t.skel}}"></div></sc-if>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
                  <div style="width: 160px; height: 10px; border-radius: 4px; background: {{t.skel}}"></div>
                  <div style="width: {{sk.w}}; height: 16px; border-radius: 4px; background: {{t.skel}}"></div>
                  <div style="width: 92%; height: 10px; border-radius: 4px; background: {{t.skel}}"></div>
                  <div style="width: 70%; height: 10px; border-radius: 4px; background: {{t.skel}}"></div>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
          <section style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 72px 24px; text-align: center; border-radius: 10px; border: 1px solid {{t.line}}; background: {{t.card}}">
            <span style="width: 48px; height: 48px; border-radius: 999px; background: {{t.chip}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{emptyIsSearch}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></sc-if>
              <sc-if value="{{emptyIsFilter}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 8v5l-4 2v-7z"></path></svg></sc-if>
            </span>
            <h2 style="margin: 0; font-size: 17px; font-weight: 600">{{emptyTitle}}</h2>
            <p style="margin: 0; font-size: 14px; line-height: 1.6; color: {{t.text2}}; max-width: 440px">{{emptyBody}}</p>
            <button type="button" onClick="{{emptyAction}}" style="margin-top: 6px; height: 40px; padding-inline: 18px; border-radius: 8px; border: 0; background: {{t.acc}}; color: {{t.onAcc}}; font: 600 14px/1 {{font}}; cursor: pointer">{{emptyCta}}</button>
          </section>
        </sc-if>

        <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
          <dc-import name="ArticleCard" item="{{it}}" theme="{{it.theme}}" ui="{{it.ui}}" hint-size="100%,140px"></dc-import>
        </sc-for>

        <sc-if value="{{showMore}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px; color: {{t.text3}}; font-size: 13px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1s" repeatCount="indefinite"></animateTransform></path></svg>
            <span>{{L.loadingMore}}</span>
          </div>
        </sc-if>
      </div>
    </main>

    <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{closeDrawer}}" aria-label="{{L.close}}" style="position: absolute; inset: 0; border: 0; padding: 0; margin: 0; background: {{t.scrim}}; cursor: default; z-index: 20"></button>

        <dc-import name="Drawer" item="{{detail}}" theme="{{theme}}" ui="{{ui}}" on-close="{{closeDrawer}}" hint-size="560px,100%"></dc-import>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>

function hhmm(m) { var x = 19 * 60 + 8 - m; var h = Math.floor(x / 60), mm = x % 60; return (h < 10 ? '0' : '') + h + ':' + (mm < 10 ? '0' : '') + mm; }
