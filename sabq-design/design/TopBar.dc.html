<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Sabq — top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header dir="{{dir}}" lang="{{ui}}" style="position: relative; z-index: 30; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 20px; padding-inline: 16px; background: {{t.panel}}; border-bottom: 1px solid {{t.line}}; color: {{t.text}}; font-family: {{font}}; font-variant-numeric: tabular-nums">
  <a href="Main.dc.html" aria-label="{{L.home}}" style="flex: none; display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{t.text}}">
    <span style="width: 30px; height: 30px; border-radius: 8px; background: {{t.acc}}; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1600" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1.8" fill="#1A1600" stroke="none"></circle><path d="M12 4a8 8 0 1 0 8 8"></path><path d="M12 8a4 4 0 1 0 4 4"></path><path d="M12 12l6.5-6.5"></path></svg>
    </span>
    <span style="font-size: 19px; font-weight: 700; letter-spacing: {{brandSpacing}}">{{L.brand}}</span>
  </a>

  <sc-if value="{{hasTabs}}" hint-placeholder-val="{{ true }}">
    <nav aria-label="{{L.views}}" style="flex: none; display: flex; align-items: stretch; gap: 4px; height: 56px">
      <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="2">
        <a href="{{tb.href}}" aria-current="{{tb.current}}" style="display: flex; align-items: center; padding-inline: 12px; font-size: 14px; font-weight: {{tb.weight}}; color: {{tb.color}}; text-decoration: none; border-bottom: 2px solid {{tb.bar}}; border-top: 2px solid transparent">{{tb.label}}</a>
      </sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{hasTitle}}" hint-placeholder-val="{{ false }}">
    <h1 style="margin: 0; padding-inline-start: 12px; border-inline-start: 1px solid {{t.line}}; font-size: 15px; font-weight: 600; color: {{t.text}}">{{title}}</h1>
  </sc-if>

  <sc-if value="{{hasTabs}}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1 1 280px; max-width: 460px; position: relative; display: flex; align-items: center">
      <label for="sabq-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{L.search}}</label>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; inset-inline-start: 11px; color: {{t.text3}}; pointer-events: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="sabq-search" type="search" value="{{query}}" onChange="{{onInput}}" placeholder="{{L.search}}" style="width: 100%; height: 36px; box-sizing: border-box; padding-inline: 34px 40px; border-radius: 8px; border: 1px solid {{t.line2}}; background: {{t.field}}; color: {{t.text}}; font: 400 14px {{font}}; outline: none">
      <kbd style="position: absolute; inset-inline-end: 8px; font: 500 11px/18px 'IBM Plex Sans',system-ui,sans-serif; padding-inline: 6px; border-radius: 4px; border: 1px solid {{t.line2}}; color: {{t.text3}}">/</kbd>
    </div>
  </sc-if>

  <div style="flex: 1"></div>

  <sc-if value="{{isUp}}" hint-placeholder-val="{{ true }}">
    <div role="status" title="{{L.liveTitle}}" style="flex: none; display: flex; align-items: center; gap: 8px; height: 30px; padding-inline: 10px; border-radius: 999px; background: {{t.chip}}">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <circle cx="6" cy="6" r="3" fill="{{t.acc}}" opacity="0.5"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="0.55;0;0.55" dur="1.8s" repeatCount="indefinite"></animate></circle>
        <circle cx="6" cy="6" r="3.2" fill="{{t.acc}}" stroke="{{t.dotRing}}" stroke-width="1.2"></circle>
      </svg>
      <span style="font-size: 13px; font-weight: 600; color: {{t.text}}">{{L.live}}</span>
    </div>
  </sc-if>
  <sc-if value="{{isDown}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="flex: none; display: flex; align-items: center; gap: 8px; height: 30px; padding-inline: 10px; border-radius: 999px; background: {{t.chip}}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.text2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="1.1s" repeatCount="indefinite"></animateTransform></path></svg>
      <span style="font-size: 13px; font-weight: 500; color: {{t.text2}}">{{L.reconnecting}}</span>
      <button type="button" style="padding: 0; border: 0; background: none; color: {{t.accText}}; font: 600 13px {{font}}; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">{{L.reload}}</button>
    </div>
  </sc-if>

  <div style="position: relative; flex: none">
    <button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuAttr}}" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; height: 44px; padding-inline: 6px 8px; border-radius: 8px; border: 1px solid {{menuBorder}}; background: transparent; color: {{t.text}}; font-family: {{font}}; cursor: pointer">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; background: {{t.chip}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{L.initials}}</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; text-align: start">
        <span style="font-size: 13px; font-weight: 600">{{L.name}}</span>
        <span style="font-size: 12px; color: {{t.text2}}">{{L.org}}</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{t.text2}}"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <sc-if value="{{menu}}" hint-placeholder-val="{{ false }}">
      <div role="menu" style="position: absolute; top: 52px; inset-inline-end: 0; width: 290px; padding: 8px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.line2}}; background: {{t.raise}}; box-shadow: {{t.shadow}}; display: flex; flex-direction: column; gap: 4px">
        <div style="padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid {{t.line}}">
          <span style="font-size: 14px; font-weight: 600">{{L.name}}</span>
          <span style="font-size: 12.5px; color: {{t.text2}}; direction: ltr; text-align: {{alignStart}}">amina.haddad@elofok.dz</span>
          <span style="font-size: 12.5px; color: {{t.text2}}">{{L.org}} · {{L.role}}</span>
        </div>
        <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{L.language}}</span>
          <div role="radiogroup" aria-label="{{L.language}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 8px; background: {{t.chip}}">
            <button type="button" role="radio" aria-checked="{{arOn}}" style="height: 34px; border: 0; border-radius: 6px; background: {{arBg}}; color: {{arFg}}; font: 600 13px 'IBM Plex Sans Arabic',system-ui,sans-serif; cursor: pointer">العربية</button>
            <button type="button" role="radio" aria-checked="{{frOn}}" style="height: 34px; border: 0; border-radius: 6px; background: {{frBg}}; color: {{frFg}}; font: 600 13px 'IBM Plex Sans',system-ui,sans-serif; cursor: pointer">Français</button>
          </div>
        </div>
        <div style="padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid {{t.line}}">
          <span style="font-size: 12px; font-weight: 600; color: {{t.text2}}">{{L.theme}}</span>
          <div role="radiogroup" aria-label="{{L.theme}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 8px; background: {{t.chip}}">
            <button type="button" role="radio" aria-checked="{{lightOn}}" style="height: 34px; border: 0; border-radius: 6px; background: {{lightBg}}; color: {{lightFg}}; font: 600 13px {{font}}; cursor: pointer">{{L.light}}</button>
            <button type="button" role="radio" aria-checked="{{darkOn}}" style="height: 34px; border: 0; border-radius: 6px; background: {{darkBg}}; color: {{darkFg}}; font: 600 13px {{font}}; cursor: pointer">{{L.dark}}</button>
          </div>
        </div>
        <a href="Account.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding-inline: 10px; border-radius: 6px; color: {{t.text}}; text-decoration: none; font-size: 14px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          {{L.account}}
        </a>
        <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding-inline: 10px; border-radius: 6px; border: 0; background: none; color: {{t.text}}; font: 400 14px {{font}}; cursor: pointer; text-align: start">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{flip}}"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"></path></svg>
          {{L.logout}}
        </button>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"ui":{"editor":"enum","options":["ar","fr"],"default":"ar"},"tab":{"editor":"enum","options":["stream","stories","none"],"default":"stream"},"title":{"editor":null},"live":{"editor":"enum","options":["up","down"],"default":"up"},"query":{"editor":null},"onQuery":{"editor":null},"menuOpen":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":64}}'>
var TK = {
  dark: {panel:'#141619',raise:'#1F2227',field:'#191B1F',line:'#272A30',line2:'#363A41',text:'#EDEDEF',text2:'#A9ACB4',text3:'#8A8E97',acc:'#FFD23F',accText:'#FFD23F',onAcc:'#1A1600',chip:'#23262B',dotRing:'#FFD23F',tabBar:'#FFD23F',shadow:'0 16px 48px rgba(0,0,0,0.55)'},
  light: {panel:'#FAFAF8',raise:'#FFFFFF',field:'#FFFFFF',line:'#E2E2DD',line2:'#CFCFC8',text:'#16171A',text2:'#4B4D55',text3:'#686B73',acc:'#FFD23F',accText:'#835800',onAcc:'#1A1600',chip:'#EFEFEB',dotRing:'#835800',tabBar:'#16171A',shadow:'0 16px 48px rgba(20,20,30,0.18)'}
};
var FONT = { ar: "'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,sans-serif", fr: "'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif" };
var LBL = {
  ar: {brand:'سبق', home:'سبق — الرادار', views:'طريقة العرض', stream:'المستجدات', stories:'القصص', search:'ابحث في العناوين والفقرات الأولى', live:'مباشر', liveTitle:'الاتصال المباشر يعمل: تصل المقالات فور رصدها', reconnecting:'جارٍ إعادة الاتصال…', reload:'تحديث',
       initials:'أ ح', name:'أمينة حداد', org:'يومية الأفق', role:'مسؤولة', language:'اللغة', theme:'المظهر', light:'فاتح', dark:'داكن', account:'الحساب', logout:'تسجيل الخروج'},
  fr: {brand:'Sabq', home:'Sabq — Radar', views:'Affichage', stream:'Fil', stories:'Sujets', search:'Rechercher dans les titres et chapôs', live:'En direct', liveTitle:'Connexion en direct active : les articles arrivent dès leur détection', reconnecting:'Reconnexion…', reload:'Recharger',
       initials:'AH', name:'Amina Haddad', org:'Quotidien El Ofok', role:'Admin', language:'Langue', theme:'Thème', light:'Clair', dark:'Sombre', account:'Compte', logout:'Se déconnecter'}
};
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menu: !!props.menuOpen }; }
  renderVals() {
    var self = this, theme = this.props.theme || 'dark', ui = this.props.ui || 'ar', tab = this.props.tab || 'stream';
    var t = TK[theme], L = LBL[ui];
    var on = function (yes) { return yes ? { bg: t.acc, fg: t.onAcc } : { bg: 'transparent', fg: t.text2 }; };
    var arS = on(ui === 'ar'), frS = on(ui === 'fr'), liS = on(theme === 'light'), dkS = on(theme === 'dark');
    var mk = function (key, href) { var cur = tab === key; return { label: L[key], href: href, current: cur ? 'page' : 'false', weight: cur ? '600' : '500', color: cur ? t.text : t.text2, bar: cur ? t.tabBar : 'transparent' }; };
    return {
      t: t, L: L, ui: ui, dir: ui === 'ar' ? 'rtl' : 'ltr', font: FONT[ui],
      brandSpacing: ui === 'ar' ? '0' : '-0.01em',
      hasTabs: tab !== 'none', hasTitle: tab === 'none' && !!this.props.title, title: this.props.title || '',
      tabs: [mk('stream', 'Main.dc.html'), mk('stories', 'Stories.dc.html')],
      query: this.props.query || '',
      onInput: function (e) { if (self.props.onQuery) self.props.onQuery(e.target.value); },
      isUp: (this.props.live || 'up') === 'up', isDown: this.props.live === 'down',
      menu: this.state.menu, menuAttr: this.state.menu ? 'true' : 'false', menuBorder: this.state.menu ? t.line2 : 'transparent',
      toggleMenu: function () { self.setState({ menu: !self.state.menu }); },
      alignStart: ui === 'ar' ? 'right' : 'left', flip: ui === 'ar' ? 'scaleX(-1)' : 'none',
      arOn: ui === 'ar' ? 'true' : 'false', frOn: ui === 'fr' ? 'true' : 'false', lightOn: theme === 'light' ? 'true' : 'false', darkOn: theme === 'dark' ? 'true' : 'false',
      arBg: arS.bg, arFg: arS.fg, frBg: frS.bg, frFg: frS.fg, lightBg: liS.bg, lightFg: liS.fg, darkBg: dkS.bg, darkFg: dkS.fg
    };
  }
}
</script>
</body>
</html>
